<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Titillium+Web:wght@600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TropicAid</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <main class="dashboard">
    <h1>Dashboard de Investimentos</h1>
    <h3 class="quote"><em>Aonde meus recursos estão sendo alocados?</em></h3>
    <hr>
    <div>
        <div style="display:inline-flex; flex-direction: row; vertical-align: top;">
            <canvas id="meuGrafico" style="width: 250px; height: 250px; margin: 5px; padding: 20px; background-color: rgba(230, 255, 255, 0.1); border-radius: 25px; backdrop-filter: blur(1px); box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);"></canvas>
        </div>
        <div  style="display:inline-flex; flex-direction: row; vertical-align: top;">
    <div id="caixa-historico" style="width: 550px; height: 210px; margin-left: 20px; margin-top: 5px; padding: 20px; background-color: rgba(230, 255, 255, 0.1); border-radius: 25px; backdrop-filter: blur(1px); box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); color: white; overflow-y: auto;">
        <strong style="font-family: 'Titillium Web', sans-serif; font-size: 1em; overflow-x: hidden;">Histórico de Investimentos neste ano:</strong><br>
        <ul id="listaDespesas" style="list-style: none; padding: 0; margin: 0; font-size: 0.9em;">
            </ul>
        </div>
</div>
    </div>
    <div style="margin: 10px;">
        <p style="background-color: rgba(155, 255, 155, 0.2); width: 170px; padding: 10px; border-radius: 10px; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); display:inline-block">Recursos Alocados: R$<span id="recursoalocado"></span></p>
        <p style="background-color: rgba(155, 155, 155, 0.2); width: 170px; padding: 10px; border-radius: 10px; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); display:inline-block; margin-left: 5px;">Recursos não alocados: R$<span id="recursonaoalocado"></span></p>
    </div>
    <div style="margin-left: 10px; margin-top: -20px;">
        <p style="background-color: rgba(255, 255, 255, 0.2); width: 170px; padding: 10px; border-radius: 10px; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); display: inline-block;">Recursos Totais: R$<span id="recursototal"></span></p>
        <p style="background-color: rgba(255, 255, 155, 0.2); width: 170px; padding: 10px; border-radius: 10px; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); display: inline-block; margin-left: 5px;">Recursos em PICLs: R$<span id="recursopicls"></span></p>
        <p style="background-color: rgba(255, 255, 155, 0.2); width: 170px; padding: 10px; border-radius: 10px; box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5); display: inline-block; margin-left: 5px;">Meta PICLs atingida? <span id="metaPiclsAtingida"></span><span id="porcentPicls"></span></p>
        <a href="adicionar.html">Adicionar despesa</a>
    </div>
    <!--Ninguém deixa o Wesley ver isso ;-;-->
    </main>
    <script src="script.js"></script>
</body>
</html>
